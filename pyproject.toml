[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lexis"
version = "0.1.0"
description = "Kişisel Sözlük ve Kelime Öğrenme Uygulaması"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    # 1.0 ilk kararlı API: genai.Client, response.parsed ve HttpOptions'a dayanıyoruz.
    "google-genai>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
lexis = "lexis.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lexis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["lexis"]
# Bu dosyalar yalnızca uygulama başlatma kodu; testte anlamlı biçimde
# çalıştırılamıyorlar.
omit = ["lexis/main.py", "lexis/ui/app.py"]

[tool.coverage.report]
# Ölçülen kapsam %84.7; eşik biraz altında tutuldu: gerileme yakalanır ama
# küçük dalgalanmalarda CI kırılmaz.
fail_under = 82
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: satır uzunluğu (UI QSS string'leri uzun olabilir), B008: Qt API kalıbı
ignore = ["E501", "B008"]
