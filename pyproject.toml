[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lexis"
version = "0.1.0"
description = "Kişisel Sözlük ve Kelime Öğrenme Uygulaması"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    # 1.0 ilk kararlı API: genai.Client, response.parsed ve HttpOptions'a dayanıyoruz.
    "google-genai>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.4.0",
]

[project.scripts]
lexis = "lexis.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lexis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: satır uzunluğu (UI QSS string'leri uzun olabilir), B008: Qt API kalıbı
ignore = ["E501", "B008"]
