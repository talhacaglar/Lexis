name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      # PyQt6 testlerini başsız (headless) çalıştır.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Sistem bağımlılıkları (PyQt6 için)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check lexis/ tests/

      # NOT: `ruff format --check` henüz eklenmedi. Eklemek için önce
      # `ruff format lexis/ tests/` bir kez çalıştırılmalı (52 dosyanın 31'ini
      # yeniden biçimlendirir); o biçimlendirme kendi commit'inde yapılmalı ki
      # bu değişikliklerin diff'ine karışmasın.

      - name: Testler + kapsam
        run: pytest -q --cov=lexis --cov-report=term

      - name: Kapsam özetini iş akışına yaz
        if: always()
        run: |
          {
            echo "### Test kapsamı (Python ${{ matrix.python-version }})"
            echo '```'
            coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
