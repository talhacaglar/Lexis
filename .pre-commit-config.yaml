# Kurulum:  pip install pre-commit && pre-commit install
# Tümünü çalıştır:  pre-commit run --all-files
#
# CI'daki lint ve biçim adımlarıyla aynı kuralları commit anında uygular.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # packaging/ altına 86 MB'lık bir derleme çıktısı sızmıştı.
        args: [--maxkb=2000]
